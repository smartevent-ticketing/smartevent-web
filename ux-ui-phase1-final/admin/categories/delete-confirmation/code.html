<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity duration-300"></div>
<!-- Modal Container -->
<div class="relative z-50 bg-surface w-full max-w-md rounded-xl shadow-[0px_12px_32px_rgba(16,20,38,0.12)] border border-outline-variant overflow-hidden transform transition-all duration-300 scale-100 opacity-100 flex flex-col">
<!-- Header -->

<div class="flex items-center gap-md">
<div class="flex-shrink-0 w-12 h-12 bg-error-container text-error rounded-full flex items-center justify-center">

</div>
<div>
<h2 class="font-title-lg text-title-lg text-on-surface">Xóa danh mục?</h2>
</div>
</div>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest p-xs rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="px-lg py-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                Bạn có chắc chắn muốn xóa danh mục '<span class="font-bold text-on-surface">Âm nhạc</span>'? Hành động này không thể hoàn tác nếu danh mục chưa có sự kiện nào tham chiếu.
            </p>
<!-- Contextual Info Block (Optional enhancement based on domain) -->
<div class="mt-md p-md bg-surface-container-low rounded-lg border border-surface-container-high flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary text-label-md mt-0.5" data-icon="info" data-weight="fill">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    Nếu danh mục đang được sử dụng, hệ thống sẽ yêu cầu di chuyển các sự kiện sang danh mục khác trước khi xóa.
                </p>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md bg-surface-container-lowest border-t border-outline-variant flex flex-col-reverse sm:flex-row justify-end gap-sm sm:gap-md">
<button class="w-full sm:w-auto px-lg py-2.5 font-label-md text-label-md text-on-surface bg-surface border border-outline-variant rounded-lg hover:bg-surface-container-highest focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors" type="button">
