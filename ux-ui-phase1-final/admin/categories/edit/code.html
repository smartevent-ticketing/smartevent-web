<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SMART EVENT Admin - Chỉnh sửa danh mục</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-container": "#d13e3a",
                    "error": "#ba1a1a",
                    "on-background": "#111c2d",
                    "on-tertiary-container": "#fffaf9",
                    "primary-container": "#635bff",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#dfe8ff",
                    "secondary-container": "#dee1fb",
                    "inverse-on-surface": "#ecf0ff",
                    "tertiary-fixed": "#ffdad6",
                    "secondary": "#5a5d73",
                    "primary-fixed": "#e2dfff",
                    "primary-fixed-dim": "#c3c0ff",
                    "surface-bright": "#f9f9ff",
                    "surface-tint": "#4c42e9",
                    "on-secondary-container": "#606379",
                    "on-secondary-fixed": "#171b2d",
                    "outline": "#777587",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-dim": "#d0daf2",
                    "inverse-primary": "#c3c0ff",
                    "surface-variant": "#d9e3fb",
                    "on-tertiary-fixed-variant": "#910913",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#dee1fb",
                    "surface-container-low": "#f0f3ff",
                    "tertiary": "#ae2424",
                    "background": "#f9f9ff",
                    "on-primary-fixed": "#0f0069",
                    "on-secondary-fixed-variant": "#42465a",
                    "on-tertiary-fixed": "#410003",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#d9e3fb",
                    "tertiary-fixed-dim": "#ffb3ac",
                    "on-surface": "#111c2d",
                    "on-primary-fixed-variant": "#321ed2",
                    "on-tertiary": "#ffffff",
                    "primary": "#493ee5",
                    "on-primary-container": "#fefaff",
                    "inverse-surface": "#273143",
                    "surface-container": "#e8eeff",
                    "outline-variant": "#c7c4d8",
                    "secondary-fixed-dim": "#c2c5de",
                    "surface": "#f9f9ff",
                    "on-surface-variant": "#464555"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "md": "16px",
                    "lg": "24px",
                    "gutter": "24px",
                    "xl": "32px",
                    "xxl": "48px",
                    "container-max": "1280px",
                    "base": "8px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "title-lg": ["Be Vietnam Pro"],
                    "label-md": ["Be Vietnam Pro"],
                    "label-sm": ["Be Vietnam Pro"],
                    "numeric-tabular": ["Be Vietnam Pro"],
                    "headline-md": ["Be Vietnam Pro"],
                    "headline-lg": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "display-lg": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "numeric-tabular": ["inherit", {"lineHeight": "inherit", "fontWeight": "inherit"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(228, 231, 236, 0.5);
            box-shadow: 0px 12px 32px rgba(16, 20, 38, 0.12);
        }
        
        .kinetic-bg {
            background: linear-gradient(135deg, #f9f9ff 0%, #e8eeff 100%);
            position: relative;
            overflow: hidden;
        }
        
        .kinetic-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(73, 62, 229, 0.05) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(5%, 5%); }
        }

        .input-focus-ring:focus-within {
            outline: 2px solid #493ee5;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen kinetic-bg">
<!-- Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 flex items-center justify-center p-md">
<!-- Modal Content -->
<div class="glass-panel w-full max-w-lg rounded-xl flex flex-col z-50 transform transition-all duration-300 scale-100 opacity-100 relative overflow-hidden">
<!-- Modal Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest relative z-10">
<h2 class="font-title-lg text-title-lg text-on-surface">Chỉnh sửa danh mục</h2>
<button aria-label="Đóng" class="text-on-surface-variant hover:text-on-surface transition-colors p-sm rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-lg bg-surface-container-lowest relative z-10">
<!-- Form Group: Tên danh mục -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="category-name">Tên danh mục <span class="text-error">*</span></label>
<div class="relative input-focus-ring rounded-DEFAULT">
<input class="w-full h-[48px] px-[12px] py-sm border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-0 transition-colors" id="category-name" placeholder="Nhập tên danh mục" type="text" value="Âm nhạc"/>
</div>
</div>
<!-- Form Group: Slug -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="category-slug">Slug</label>
<div class="relative input-focus-ring rounded-DEFAULT flex items-center">
<span class="absolute left-[12px] text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">link</span>
</span>
<input class="w-full h-[48px] pl-[40px] pr-[12px] py-sm border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-0 transition-colors" id="category-slug" placeholder="nhap-slug-danh-muc" type="text" value="am-nhac"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Đường dẫn thân thiện cho SEO. Để trống để tự động tạo từ tên.</p>
</div>
<!-- Form Group: Mô tả -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="category-description">Mô tả</label>
<div class="relative input-focus-ring rounded-DEFAULT">
<textarea class="w-full px-[12px] py-[12px] border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:border-primary focus:ring-0 transition-colors resize-none" id="category-description" placeholder="Nhập mô tả ngắn gọn về danh mục này" rows="4">Các sự kiện âm nhạc, liveshow, concert</textarea>
</div>
</div>
<!-- Status Toggle (Optional enhancement for Admin) -->
<div class="flex items-center justify-between pt-sm">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Trạng thái hoạt động</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Hiển thị danh mục này trên ứng dụng</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
<!-- Modal Footer -->
<div class="px-lg py-md border-t border-outline-variant flex justify-end gap-md bg-surface-container-lowest rounded-b-xl relative z-10">
<button class="h-[48px] px-lg font-label-md text-label-md text-on-surface bg-surface border border-outline-variant rounded-[10px] hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    Hủy
                </button>
<button class="h-[48px] px-lg font-label-md text-label-md font-bold text-on-primary bg-primary rounded-[10px] hover:bg-surface-tint shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]">save</span>
                    Lưu thay đổi
                </button>
</div>
<!-- Kinetic Accent Line -->
<div class="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-primary via-primary-container to-primary w-full z-20"></div>
</div>
</div>
</body></html>
