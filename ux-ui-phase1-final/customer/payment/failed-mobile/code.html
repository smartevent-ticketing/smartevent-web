<div class="flex flex-col items-center text-center space-y-md w-full">

</div>

</div>

<span class="text-label-md font-label-md text-on-surface font-semibold uppercase tabular-nums">SE-ORD-2024-A8F21</span>
</div>

<span class="text-title-lg font-title-lg text-primary font-bold tabular-nums">1.500.000 ₫</span>
</div>
</div>

<div class="w-full flex flex-col gap-sm pt-md">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg text-label-md font-label-md font-bold shadow-sm active:scale-95 transition-transform flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>

            </button>
<button class="w-full h-12 bg-surface-container-high text-on-surface rounded-lg text-label-md font-label-md font-bold active:scale-95 transition-transform flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>

            </button>
