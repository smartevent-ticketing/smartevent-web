<style>
        .input-focus-ring:focus {
            outline: 2px solid #493ee5;

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md">
<main class="w-full max-w-[390px] mx-auto p-md flex flex-col h-full bg-surface">
<!-- Header -->
<header class="flex flex-col items-center pt-xl pb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">SMART EVENT</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Tạo tài khoản để bắt đầu</p>
</header>
<!-- Register Form -->
<form action="#" class="flex flex-col gap-md flex-grow justify-center" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullname">Họ và tên</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-[48px] pl-10 pr-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary input-focus-ring transition-colors" id="fullname" name="fullname" placeholder="Nhập họ và tên" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[48px] pl-10 pr-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary input-focus-ring transition-colors" id="email" name="email" placeholder="example@email.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="phone">Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">phone</span>
<input class="w-full h-[48px] pl-10 pr-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary input-focus-ring transition-colors" id="phone" name="phone" placeholder="Nhập số điện thoại" required="" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[48px] pl-10 pr-10 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary input-focus-ring transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none input-focus-ring rounded" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Xác nhận mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[48px] pl-10 pr-10 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary input-focus-ring transition-colors" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu" required="" type="password"/>
</div>
</div>
<div class="mt-lg">
<button class="w-full h-[48px] bg-primary text-on-primary font-title-lg text-title-lg rounded-[10px] hover:bg-surface-tint active:bg-primary-container shadow-sm hover:shadow-md transition-all input-focus-ring" type="submit">
                    Tạo tài khoản
                </button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-xl pb-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Đã có tài khoản? 
                <a class="text-primary font-bold hover:underline hover:text-surface-tint transition-colors input-focus-ring rounded px-1" href="#">Đăng nhập</a>
</p>
</div>
</main>
</body></html>
