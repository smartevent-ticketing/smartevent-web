<body class="bg-background text-on-background antialiased flex flex-col min-h-screen justify-center max-w-[390px] mx-auto overflow-hidden">
<main class="flex-grow flex flex-col w-full p-md">
<!-- Header / Logo Area -->

<h1 class="font-display-lg text-display-lg text-primary tracking-tight">SMART EVENT</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-center">Nền tảng quản lý sự kiện thông minh</p>
</div>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg w-full">
<h2 class="font-headline-md text-headline-md mb-lg">Đăng nhập</h2>
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-[12px] top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[48px] pl-[40px] pr-[12px] rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all" id="email" name="email" placeholder="Nhập email của bạn" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-[12px] top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[48px] pl-[40px] pr-[40px] rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute right-[12px] top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary text-on-primary rounded-[10px] font-label-md text-label-md font-bold mt-sm hover:bg-primary-container hover:text-on-primary-container focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all shadow-[0_4px_20px_rgba(16,20,38,0.08)]" type="submit">
                    Đăng nhập
                </button>
</form>
<div class="mt-lg text-center flex flex-col gap-xs">
<p class="font-body-md text-body-md text-on-surface-variant">Chưa có tài khoản?</p>
<a class="font-label-md text-label-md text-primary font-bold hover:underline" href="#">Đăng ký mới ngay</a>
</div>
