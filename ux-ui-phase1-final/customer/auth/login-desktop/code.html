<!DOCTYPE html>

<style>
        .shadow-elevation-2 {
            box-shadow: 0px 4px 20px rgba(16, 20, 38, 0.08);
        }
        .focus-ring {
            outline: none;
        }
        .focus-ring:focus-visible {
            box-shadow: 0 0 0 2px #f9f9ff, 0 0 0 4px #493ee5;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex flex-col antialiased">
<!-- Top NavBar (Suppressed content, logo only for transactional intent) -->
<header class="bg-surface border-b border-outline-variant shadow-sm w-full top-0 z-50">
<div class="flex justify-between items-center w-full px-lg md:px-xl max-w-container-max mx-auto h-[72px]">
<div class="flex items-center">
<span class="text-title-lg font-title-lg font-bold text-primary">SMART EVENT</span>
</div>
<!-- Navigation links suppressed for login -->
</div>
</header>
<!-- Main Content: Split Screen -->
<main class="flex-grow flex w-full">
<div class="flex flex-col md:flex-row w-full max-w-container-max mx-auto h-full items-center justify-center p-md lg:p-xxl gap-xl">
<!-- Left Side: Visual -->
<div class="hidden md:flex w-1/2 h-full items-center justify-center relative rounded-xl overflow-hidden shadow-elevation-2" style="min-height: 600px;">
<div class="bg-cover bg-center w-full h-full absolute inset-0" data-alt="A highly detailed and energetic photograph of a massive live music concert in a modern stadium. The scene is illuminated by striking laser lights primarily in electric indigo and vivid magenta, piercing through atmospheric fog. A massive crowd of ecstatic fans can be seen cheering with their hands up in the air. The aesthetic is dynamic, modern, and high-tech, reflecting a premium live event ticketing platform. The lighting is dramatic but retains a clean, structured composition." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAxMY4vpvkkvJRClqnlnHQynNr71SKuD893b8QuQvUj1kYR9xzWJZdYaEltJtmXljFbYjfHdnHn3wrondbaZtkLWbQ7CoxeaoRfsjbL2bdZaxffeFp8jSTis1htIY6Yfo5ABA9eHQqoVeGichtCuEw9XJ-rS4Mkl4PjAAGoiqAcJ5ddTXYgIxogYwWanwImjedDAoA4QV1MjanGM17UiNvs9_JTqqltsTiPE39MqknkEyOHgvF8ASk1')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-[#111c2d]/80 to-transparent flex flex-col justify-end p-xl">
<h2 class="text-headline-lg font-headline-lg text-on-primary mb-sm">Trải nghiệm không giới hạn</h2>
<p class="text-body-lg font-body-lg text-on-primary/90">Tham gia hàng ngàn sự kiện âm nhạc, thể thao và văn hóa hàng đầu.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-md">
<div class="bg-surface-container-lowest p-xl rounded-xl shadow-elevation-2 w-full max-w-[480px] border border-outline-variant">
<div class="mb-xl text-center">
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-sm">Chào mừng trở lại</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Vui lòng đăng nhập để tiếp tục</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<!-- Email / Phone Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="username">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-xl pr-md py-[12px] bg-surface-bright border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus-ring focus:border-primary transition-colors" id="username" name="username" placeholder="Nhập email" required="" style="border-radius: 10px;" type="text"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="password">Mật khẩu</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-xl pr-md py-[12px] bg-surface-bright border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus-ring focus:border-primary transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" required="" style="border-radius: 10px;" type="password"/>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center cursor-pointer text-outline hover:text-on-surface transition-colors" onclick="togglePassword()">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="pt-sm">
<button class="w-full h-[48px] bg-primary text-on-primary text-label-md font-label-md font-bold rounded-lg hover:bg-primary-container focus-ring transition-colors shadow-elevation-2 flex items-center justify-center gap-sm" style="border-radius: 10px;" type="submit">
                                Đăng nhập
                                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Action -->
<div class="mt-xl text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                            Chưa có tài khoản? 
                            <a class="text-primary font-medium hover:text-primary-container underline focus-ring rounded-sm" href="#">Đăng ký tài khoản mới</a>
</p>
</div>
</div>
</div>
</div>
</main>
<!-- Footer (Minimal) -->
<footer class="bg-surface-container-highest border-t border-outline-variant w-full mt-auto">
<div class="flex justify-center items-center w-full px-lg py-md max-w-container-max mx-auto">
<p class="text-label-sm font-label-sm text-on-surface-variant">© 2024 SMART EVENT. All rights reserved.</p>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
