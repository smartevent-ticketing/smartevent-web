<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Phiên đăng nhập đã hết hạn</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "gutter": "24px",

<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline shadow-sm dark:shadow-none flex items-center justify-between px-md h-12 w-full max-w-container-max mx-auto md:hidden">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="search">search</span>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed tracking-tight">
            SMART EVENT
        </div>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-sm">person</span>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-md mt-12 pb-safe md:hidden relative overflow-hidden">
<div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
<div class="w-64 h-64 rounded-full border-2 border-primary pulse-ring"></div>
<div class="w-64 h-64 rounded-full border-2 border-primary pulse-ring" style="animation-delay: 0.5s;"></div>
<div class="w-64 h-64 rounded-full border-2 border-primary pulse-ring" style="animation-delay: 1s;"></div>
</div>
<div class="w-full max-w-[400px] bg-surface-container-lowest rounded-2xl p-xl shadow-lg border border-outline-variant relative z-10 flex flex-col items-center text-center">
<div class="w-20 h-20 bg-error-container rounded-full flex items-center justify-center mb-6 relative">
<span class="material-symbols-outlined text-[40px] text-error" style="font-variation-settings: 'FILL' 1;">timer_off</span>
<div class="absolute -right-1 -top-1 w-6 h-6 bg-error rounded-full border-2 border-surface-container-lowest flex items-center justify-center">
<span class="material-symbols-outlined text-on-error text-[14px]">exclamation</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Phiên đăng nhập đã hết hạn</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 px-4">
                Vui lòng đăng nhập lại để tiếp tục.
            </p>
<div class="w-full flex flex-col gap-4">
<button class="w-full h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-[10px] flex items-center justify-center hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:scale-[0.98]">
                    Đăng nhập lại
                </button>
<button class="w-full h-[48px] bg-transparent text-secondary border border-outline-variant font-label-md text-label-md rounded-[10px] flex items-center justify-center hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:scale-[0.98]">
                    Về trang chủ
                </button>
</div>
</div>
</main>
<div class="hidden md:flex flex-col items-center justify-center min-h-screen text-center p-xl">
<p class="font-body-lg text-body-lg text-secondary">Vui lòng sử dụng thiết bị di động để xem màn hình này.</p>
</div>
