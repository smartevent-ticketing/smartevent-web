<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        
        /* Kinetic Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .kinetic-ring {
            position: absolute;
            border-radius: 50%;
            background-color: theme('colors.primary-fixed');
            animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: 0;
        }

        .kinetic-ring:nth-child(2) {
            animation-delay: 1s;
        }

        .kinetic-ring:nth-child(3) {
            animation-delay: 2s;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        
        .focus-ring {
            outline: none;
        }
        .focus-ring:focus-visible {
            outline: 2px solid theme('colors.primary');
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center overflow-hidden antialiased">
<!-- Ambient Background Texture -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 50%, theme('colors.primary-fixed-dim') 0%, transparent 70%);"></div>
<main class="relative z-10 flex flex-col items-center justify-center w-full max-w-md px-lg w-full">
<!-- Icon Container with Kinetic Pulse -->
<div class="relative flex items-center justify-center w-32 h-32 mb-xl animate-fade-in-up">
<div class="kinetic-ring w-full h-full"></div>
<div class="kinetic-ring w-full h-full"></div>
<div class="kinetic-ring w-full h-full"></div>
<div class="relative z-10 flex items-center justify-center w-20 h-20 bg-surface-container-lowest rounded-full shadow-[0px_12px_32px_rgba(16,20,38,0.12)] border border-outline-variant">
<span class="material-symbols-outlined text-error" style="font-size: 40px; font-variation-settings: 'FILL' 1;">
                    history_toggle_off
                </span>
</div>
</div>
<!-- Typography Content -->
<div class="text-center mb-xxl flex flex-col items-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-base animate-fade-in-up delay-100">
                Phiên đăng nhập đã hết hạn
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] animate-fade-in-up delay-200">
                Vui lòng đăng nhập lại để tiếp tục trải nghiệm các dịch vụ của chúng tôi một cách an toàn.
            </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full gap-md animate-fade-in-up delay-200">
<button class="focus-ring w-full h-[48px] bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md rounded-[10px] flex items-center justify-center transition-colors shadow-[0px_4px_20px_rgba(16,20,38,0.08)]" type="button">
                Đăng nhập lại
            </button>
<button class="focus-ring w-full h-[48px] bg-surface-container-lowest hover:bg-surface-container-high text-on-surface font-label-md text-label-md border border-outline-variant rounded-[10px] flex items-center justify-center transition-colors" type="button">
                Về trang chủ
            </button>
</div>
</main>
<script>
        // Optional subtle interaction script
        document.addEventListener('mousemove', (e) => {
            const rings = document.querySelectorAll('.kinetic-ring');
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            
            rings.forEach((ring, index) => {
                ring.style.transform = `translate(${x * (index + 1)}px, ${y * (index + 1)}px) scale(${1 + (index * 0.5)})`;
            });
        });
    </script>
