<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Không Có Quyền Truy Cập - SMART EVENT</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "primary": "#493ee5",
                    "primary-fixed": "#e2dfff",
                    "tertiary": "#ae2424",
                    "on-secondary-fixed": "#171b2d",
                    "tertiary-fixed": "#ffdad6",
                    "secondary": "#5a5d73",
                    "on-secondary-container": "#606379",
                    "on-primary-fixed": "#0f0069",
                    "on-tertiary-fixed": "#410003",
                    "on-tertiary-fixed-variant": "#910913",
                    "secondary-fixed-dim": "#c2c5de",
                    "secondary-fixed": "#dee1fb",
                    "on-background": "#111c2d",
                    "tertiary-fixed-dim": "#ffb3ac",
                    "outline": "#777587",
                    "inverse-primary": "#c3c0ff",
                    "surface-dim": "#d0daf2",
                    "on-secondary-fixed-variant": "#42465a",
                    "outline-variant": "#c7c4d8",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface": "#f9f9ff",
                    "inverse-on-surface": "#ecf0ff",
                    "background": "#f9f9ff",
                    "error": "#ba1a1a",
                    "on-primary-container": "#fefaff",
                    "surface-variant": "#d9e3fb",
                    "primary-container": "#635bff",
                    "secondary-container": "#dee1fb",
                    "on-secondary": "#ffffff",
                    "surface-tint": "#4c42e9",
                    "on-tertiary-container": "#fffaf9",
                    "tertiary-container": "#d13e3a",
                    "surface-bright": "#f9f9ff",
                    "on-primary-fixed-variant": "#321ed2",
                    "on-surface-variant": "#464555",
                    "surface-container-low": "#f0f3ff",
                    "surface-container-highest": "#d9e3fb",
                    "surface-container-high": "#dfe8ff",
                    "surface-container": "#e8eeff",
                    "on-error-container": "#93000a",
                    "on-surface": "#111c2d",
                    "inverse-surface": "#273143",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#c3c0ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "xl": "32px",
                    "md": "16px",
                    "base": "8px",
                    "lg": "24px",
                    "sm": "8px",
                    "xs": "4px",
                    "container-max": "1280px",
                    "xxl": "48px"
            },
            "fontFamily": {
                    "label-md": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "label-sm": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "headline-lg": ["Be Vietnam Pro"],
                    "numeric-tabular": ["Be Vietnam Pro"],
                    "title-lg": ["Be Vietnam Pro"],
                    "headline-md": ["Be Vietnam Pro"],
                    "display-lg": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "numeric-tabular": ["inherit", {"lineHeight": "inherit", "fontWeight": "inherit"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        .kinetic-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(186, 26, 26, 0);
            }
            100% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(186, 26, 26, 0);
            }
        }
        
        .floating-lock {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center font-body-md antialiased overflow-hidden relative">
<!-- Abstract Kinetic Background Elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-error-container opacity-20 blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-tertiary-fixed opacity-30 blur-3xl mix-blend-multiply"></div>
<!-- Diagonal Structural Grid Lines -->
<svg class="absolute inset-0 w-full h-full opacity-[0.03]" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="gridPattern" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#gridPattern)" height="100%" transform="rotate(-15) scale(1.5)" transform-origin="center" width="100%"></rect>
</svg>
</div>
<main class="relative z-10 flex flex-col items-center justify-center w-full px-md max-w-[400px] mx-auto text-center">
<!-- Animated Icon Container -->
<div class="relative w-32 h-32 mb-xl flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full kinetic-pulse bg-error-container opacity-30"></div>
<div class="absolute inset-4 rounded-full kinetic-pulse bg-error-container opacity-50" style="animation-delay: 0.3s"></div>
<!-- Lock Icon -->
<div class="relative z-10 w-20 h-20 bg-surface-container-lowest rounded-full shadow-[0_12px_32px_rgba(186,26,26,0.15)] flex items-center justify-center border border-error-container floating-lock">
<span class="material-symbols-outlined text-error font-display-lg" style="font-variation-settings: 'FILL' 1; font-size: 40px;">
                    lock
                </span>
</div>
</div>
<!-- Text Content -->
<div class="space-y-sm mb-xxl w-full">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
                Bạn không có quyền truy cập
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                Tài khoản của bạn hiện tại không có đủ quyền hạn để xem trang này. Vui lòng kiểm tra lại.
            </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full space-y-md">
<button class="w-full h-[48px] bg-primary text-on-primary font-label-md text-label-md font-bold rounded-lg shadow-[0_4px_20px_rgba(73,62,229,0.2)] hover:bg-surface-tint active:scale-95 transition-all duration-200 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined mr-sm" style="font-size: 20px;">
                    arrow_back
                </span>
                Quay lại
            </button>
<button class="w-full h-[48px] bg-surface-container-lowest text-primary font-label-md text-label-md font-bold rounded-lg border border-outline-variant hover:bg-surface-container-low active:scale-95 transition-all duration-200 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 shadow-sm">
                Về trang chủ
            </button>
</div>
<!-- Support Link -->
<div class="mt-lg">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors inline-flex items-center" href="#">
<span class="material-symbols-outlined mr-xs" style="font-size: 16px;">
                    help
                </span>
                Cần hỗ trợ?
            </a>
</div>
</main>
<!-- Suppressed TopAppBar & BottomNavBar as per logic rules for dead-end/error states -->
</body></html>
