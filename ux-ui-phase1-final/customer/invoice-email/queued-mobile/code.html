<!DOCTYPE html>

<html lang="vi"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .animate-pulse-ring::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background-color: theme('colors.primary');
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col items-center justify-center overflow-y-auto overflow-x-hidden md:hidden">
<!-- Top Navigation Container -->
<header class="flex items-center w-full px-md h-[64px] sticky top-0 z-50 bg-surface border-b border-outline-variant">
<button class="p-sm rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="fill">arrow_back</span>
</button>
<h1 class="ml-sm font-title-lg text-title-lg text-primary flex-1 truncate">Chi tiết hóa đơn</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[390px] p-md flex flex-col items-center justify-center mt-[-64px] min-h-[calc(100vh-64px)] safe-area-pt">
<!-- Animated Illustration Container -->
<div class="relative mb-lg w-[120px] h-[120px] flex items-center justify-center">
<!-- Pulsing background effect -->
<div class="absolute inset-0 bg-primary/10 rounded-full animate-pulse-ring"></div>
<div class="absolute inset-0 bg-primary/20 rounded-full scale-75"></div>
<!-- Compact inline SVG envelope-and-clock -->
<div class="relative z-10 w-20 h-20 bg-surface-container-highest rounded-full flex items-center justify-center shadow-lg border border-outline-variant">
<svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 7.00005L10.2 11.65C11.2667 12.45 12.7333 12.45 13.8 11.65L20 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<rect height="14" rx="2" stroke="currentColor" stroke-linecap="round" stroke-width="2" width="18" x="3" y="5"></rect>
<!-- Clock Overlay -->
<circle cx="17" cy="17" fill="#f9f9ff" r="6" stroke="currentColor" stroke-width="1.5"></circle>
<polyline points="17 14 17 17 19 18" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></polyline>
</svg>
</div>
</div>
<!-- Status Badge -->
<div class="mb-sm px-3 py-1 bg-surface-container-high rounded-full border border-outline-variant flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Đang xử lý</span>
</div>
<!-- Text Content -->
<div class="text-center w-full px-sm mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">Đã tiếp nhận yêu cầu gửi hóa đơn</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-md">
                Yêu cầu gửi hóa đơn <span class="font-semibold text-on-surface">INV-20260822-ABC12345</span> tới <span class="font-semibold text-primary">customer@example.com</span> đang được xử lý.
            </p>
</div>
<!-- Information Notice Panel -->
<div class="w-full bg-surface-container-low border border-primary-fixed-dim rounded-lg p-md mb-xl flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-xs shrink-0" data-icon="info" data-weight="fill">info</span>
<p class="font-label-md text-label-md text-on-surface-variant">
                Hệ thống sẽ xử lý yêu cầu trong nền. Bạn có thể kiểm tra hộp thư sau.
             </p>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-sm pb-lg mt-auto">
<button class="w-full h-[48px] bg-primary text-white font-title-lg text-title-lg font-bold rounded-[10px] flex items-center justify-center hover:bg-primary-container active:scale-95 transition-all shadow-md">
                Về chi tiết hóa đơn
            </button>
<button class="w-full h-[48px] bg-surface text-primary border border-primary-fixed-dim font-title-lg text-title-lg font-semibold rounded-[10px] flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all">
                Về danh sách hóa đơn
            </button>
</div>
</main>
</body></html>
