<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hóa đơn của tôi - Lỗi</title>

                        "on-tertiary-fixed-variant": "#910913",
                        "inverse-surface": "#273143",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#c3c0ff",
                        "surface": "#f9f9ff",
                        "on-tertiary-container": "#fffaf9",
                        "on-primary-container": "#fefaff",
                        "on-secondary-container": "#606379",
                        "error-container": "#ffdad6",
                        "surface-variant": "#d9e3fb",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdad6",
                        "on-error": "#ffffff",
                        "tertiary-container": "#d13e3a",
                        "primary": "#493ee5",
                        "surface-container": "#e8eeff",
                        "surface-tint": "#4c42e9",
                        "tertiary-fixed-dim": "#ffb3ac",
                        "outline-variant": "#c7c4d8",
                        "on-surface-variant": "#464555",

                        "tertiary": "#ae2424",
                        "surface-container-high": "#dfe8ff",
                        "on-secondary-fixed": "#171b2d",
                        "primary-fixed": "#e2dfff",
                        "primary-fixed-dim": "#c3c0ff",
                        "secondary": "#5a5d73",
                        "surface-dim": "#d0daf2",
                        "on-primary-fixed": "#0f0069",
                        "background": "#f9f9ff",
                        "on-tertiary": "#ffffff",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {

                        "xs": "4px",

                        "md": "16px",
                        "xl": "32px",
                        "lg": "24px",
                        "gutter": "24px",
                        "base": "8px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "numeric-tabular": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-md": ["Be Vietnam Pro"],

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md w-full max-w-[390px] mx-auto overflow-x-hidden relative shadow-2xl">
<!-- Top App Bar (Minimal for sub-page) -->
<header class="flex justify-between items-center px-4 h-16 w-full bg-surface z-10 sticky top-0">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-title-lg font-title-lg flex-1 text-center truncate pr-10">Hóa đơn của tôi</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12 text-center h-full">
<!-- Error Illustration / Icon -->
<div class="mb-8 relative flex items-center justify-center">
<div class="absolute w-32 h-32 bg-error-container rounded-full opacity-50 animate-pulse"></div>
<div class="w-24 h-24 bg-error-container text-on-error-container rounded-full flex items-center justify-center z-10 shadow-sm border border-error/20">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
</div>
<!-- Error Messaging -->
<h2 class="text-headline-md font-headline-md mb-2 text-on-background">Không thể tải danh sách hóa đơn</h2>
<p class="text-body-md font-body-md text-on-surface-variant mb-6 max-w-[280px]">
            Đã xảy ra sự cố khi tải dữ liệu hóa đơn. Vui lòng thử lại.
        </p>
<!-- Secondary Info -->
<div class="bg-surface-container-low px-4 py-3 rounded-lg flex items-start gap-3 mb-10 border border-outline-variant/30 text-left w-full">
<span class="material-symbols-outlined text-secondary text-[20px] mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="text-label-md font-label-md text-on-surface-variant flex-1">
                Thông tin của bạn không bị thay đổi.
            </p>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<button class="w-full h-12 bg-primary text-on-primary text-label-md font-label-md rounded-[10px] font-bold flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 relative overflow-hidden" id="retry-btn">
<span class="material-symbols-outlined text-[20px] btn-icon transition-transform duration-300">refresh</span>
<span class="btn-text">Thử lại</span>
<!-- Loading Spinner (Hidden by default) -->
<svg class="animate-spin hidden w-5 h-5 text-on-primary absolute loading-spinner" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>
<button class="w-full h-12 bg-surface text-primary border border-outline-variant text-label-md font-label-md rounded-[10px] font-bold flex items-center justify-center transition-all active:scale-[0.98] hover:bg-surface-container-highest focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                Về trang cá nhân
            </button>
</div>
</main>
<!-- Bottom Nav is suppressed as this is a sub-page/error state focused on resolution -->
<script>
        // Simple loading interaction simulation for retry button
        document.getElementById('retry-btn').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.btn-icon');
            const text = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.loading-spinner');
            
            // Set loading state
            btn.classList.add('opacity-90', 'cursor-wait');
            icon.classList.add('hidden');
            text.classList.add('invisible');
            spinner.classList.remove('hidden');
            
            // Simulate network request delay then reset
            setTimeout(() => {
                btn.classList.remove('opacity-90', 'cursor-wait');
                icon.classList.remove('hidden');
                text.classList.remove('invisible');
                spinner.classList.add('hidden');
                
                // Optional: add a little shake animation to show it failed again
                btn.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 400, easing: 'ease-in-out' });
                
            }, 1500);
        });
    </script>
</body></html>
