<!DOCTYPE html>

<html class="h-full" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Chi tiết hóa đơn</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#ffdad6",
                        "tertiary": "#ae2424",
                        "secondary-fixed": "#dee1fb",
                        "error": "#ba1a1a",
                        "surface-bright": "#f9f9ff",
                        "secondary-container": "#dee1fb",
                        "on-primary-fixed": "#0f0069",
                        "surface-container-high": "#dfe8ff",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#ecf0ff",
                        "on-surface-variant": "#464555",
                        "tertiary-container": "#d13e3a",
                        "on-secondary-fixed": "#171b2d",
                        "on-secondary-container": "#606379",
                        "on-primary-container": "#fefaff",
                        "on-secondary-fixed-variant": "#42465a",
                        "primary-fixed-dim": "#c3c0ff",
                        "inverse-surface": "#273143",
                        "outline-variant": "#c7c4d8",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#d9e3fb",
                        "surface-tint": "#4c42e9",
                        "secondary-fixed-dim": "#c2c5de",
                        "on-surface": "#111c2d",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f0f3ff",
                        "inverse-primary": "#c3c0ff",
                        "primary": "#493ee5",
                        "surface-container-highest": "#d9e3fb",
                        "secondary": "#5a5d73",
                        "on-primary-fixed-variant": "#321ed2",
                        "primary-fixed": "#e2dfff",
                        "background": "#f9f9ff",
                        "on-background": "#111c2d",
                        "on-tertiary-fixed": "#410003",
                        "surface-dim": "#d0daf2",
                        "on-tertiary": "#ffffff",
                        "surface": "#f9f9ff",
                        "outline": "#777587",
                        "primary-container": "#635bff",
                        "surface-container": "#e8eeff",
                        "on-tertiary-container": "#fffaf9",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#910913",
                        "tertiary-fixed-dim": "#ffb3ac"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "md": "16px",
                        "base": "8px",
                        "container-max": "1280px",
                        "sm": "8px",
                        "xl": "32px",
                        "xs": "4px",
                        "lg": "24px",
                        "xxl": "48px",
                        "gutter": "24px"
                    },
                    fontFamily: {
                        "body-lg": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-md": ["Be Vietnam Pro"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "title-lg": ["Be Vietnam Pro"],
                        "numeric-tabular": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "display-lg": ["Be Vietnam Pro"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "title-lg": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "numeric-tabular": ["inherit", { lineHeight: "inherit", fontWeight: "inherit" }],
                        "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }],
                        "display-lg": ["48px", { lineHeight: "60px", letterSpacing: "-0.02em", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .skeleton {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        /* Focus ring for accessibility */
        *:focus-visible {
            outline: 2px solid #493ee5;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full font-body-md flex flex-col items-center">
<div aria-busy="true" aria-label="Đang tải thông tin hóa đơn..." class="w-full max-w-[390px] h-full bg-background relative flex flex-col shadow-2xl overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center w-full px-md h-[64px] sticky top-0 z-50 bg-surface border-b border-outline-variant">
<button aria-label="Quay lại" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 transition-transform mr-2">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary flex-1">Chi tiết hóa đơn</h1>
</header>
<!-- Main Content Area (Skeleton Loading) -->
<main aria-hidden="true" class="flex-1 overflow-y-auto px-md py-lg space-y-lg pb-24">
<!-- Accessible Loading Label (Visually Hidden but available to screen readers) -->
<div class="sr-only">Đang tải thông tin hóa đơn...</div>
<!-- Summary Card Skeleton -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm">
<div class="flex justify-between items-start mb-lg">
<div class="space-y-sm w-1/2">
<div class="h-4 bg-surface-variant rounded skeleton w-2/3"></div>
<div class="h-8 bg-surface-container-highest rounded skeleton w-3/4"></div>
</div>
<div class="h-6 w-16 bg-surface-variant rounded-full skeleton"></div>
</div>
<div class="border-t border-surface-variant pt-md space-y-sm">
<div class="flex justify-between">
<div class="h-4 bg-surface-variant rounded skeleton w-1/4"></div>
<div class="h-4 bg-surface-variant rounded skeleton w-1/3"></div>
</div>
<div class="flex justify-between">
<div class="h-4 bg-surface-variant rounded skeleton w-1/5"></div>
<div class="h-4 bg-surface-variant rounded skeleton w-1/4"></div>
</div>
</div>
</section>
<!-- Billing Details Skeleton -->
<section class="space-y-sm">
<div class="h-5 bg-surface-variant rounded skeleton w-1/3 mb-md"></div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md space-y-md">
<div>
<div class="h-3 bg-surface-variant rounded skeleton w-1/4 mb-xs"></div>
<div class="h-4 bg-surface-container-highest rounded skeleton w-3/4"></div>
</div>
<div>
<div class="h-3 bg-surface-variant rounded skeleton w-1/5 mb-xs"></div>
<div class="h-4 bg-surface-container-highest rounded skeleton w-full"></div>
<div class="h-4 bg-surface-container-highest rounded skeleton w-2/3 mt-xs"></div>
</div>
<div>
<div class="h-3 bg-surface-variant rounded skeleton w-1/4 mb-xs"></div>
<div class="h-4 bg-surface-container-highest rounded skeleton w-1/2"></div>
</div>
</div>
</section>
<!-- Order Items Skeleton -->
<section class="space-y-sm">
<div class="h-5 bg-surface-variant rounded skeleton w-2/5 mb-md"></div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md space-y-md">
<!-- Item 1 -->
<div class="flex justify-between items-center pb-md border-b border-surface-variant">
<div class="flex items-center space-x-sm w-2/3">
<div class="w-12 h-12 bg-surface-variant rounded skeleton shrink-0"></div>
<div class="space-y-xs w-full">
<div class="h-4 bg-surface-container-highest rounded skeleton w-full"></div>
<div class="h-3 bg-surface-variant rounded skeleton w-1/2"></div>
</div>
</div>
<div class="h-4 bg-surface-container-highest rounded skeleton w-1/5"></div>
</div>
<!-- Item 2 -->
<div class="flex justify-between items-center pb-md border-b border-surface-variant">
<div class="flex items-center space-x-sm w-2/3">
<div class="w-12 h-12 bg-surface-variant rounded skeleton shrink-0"></div>
<div class="space-y-xs w-full">
<div class="h-4 bg-surface-container-highest rounded skeleton w-4/5"></div>
<div class="h-3 bg-surface-variant rounded skeleton w-1/3"></div>
</div>
</div>
<div class="h-4 bg-surface-container-highest rounded skeleton w-1/5"></div>
</div>
<!-- Item 3 -->
<div class="flex justify-between items-center">
<div class="flex items-center space-x-sm w-2/3">
<div class="w-12 h-12 bg-surface-variant rounded skeleton shrink-0"></div>
<div class="space-y-xs w-full">
<div class="h-4 bg-surface-container-highest rounded skeleton w-full"></div>
<div class="h-3 bg-surface-variant rounded skeleton w-2/5"></div>
</div>
</div>
<div class="h-4 bg-surface-container-highest rounded skeleton w-1/5"></div>
</div>
</div>
</section>
<!-- Total Skeleton -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md flex justify-between items-center shadow-sm">
<div class="h-5 bg-surface-variant rounded skeleton w-1/4"></div>
<div class="h-6 bg-surface-container-highest rounded skeleton w-1/3"></div>
</section>
</main>
<!-- BottomNavBar (Suppressed based on logic for transactional/detail page, but requested in prompt) -->
<nav class="fixed bottom-0 w-full max-w-[390px] z-50 flex justify-around items-center px-base py-sm bg-surface-container-lowest rounded-t-xl shadow-[0_-4px_20px_rgba(16,20,38,0.08)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all duration-200 p-2">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm mt-1">Trang chủ</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all duration-200 p-2">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-label-sm text-label-sm mt-1">Khám phá</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="confirmation_number" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<span class="font-label-sm text-label-sm mt-1">Vé của tôi</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all duration-200 p-2">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm mt-1">Tài khoản</span>
</button>
</nav>
</div>
</body></html>
