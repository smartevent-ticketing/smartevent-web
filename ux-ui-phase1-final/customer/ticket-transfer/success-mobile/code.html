            width: 80px;
            height: 80px;

        }
        .success-icon-container::before {

            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background-color: #e2dfff;
            z-index: 0;
        }
        .success-icon-container::after {
            content: '';
