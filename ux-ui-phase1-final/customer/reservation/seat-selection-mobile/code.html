<style>

        .seat { width: 24px; height: 24px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; margin: 2px; }

        .seat.sold { background-color: #dee1fb; border: 1px solid #777587; color: #5a5d73; opacity: 0.5; cursor: not-allowed; }
        .seat.selected { background-color: #493ee5; border: 1px solid #493ee5; color: #ffffff; box-shadow: 0 0 0 2px #e2dfff; }
        
        /* Area Specific */
        .area-standing { background: linear-gradient(135deg, rgba(73, 62, 229, 0.1) 0%, rgba(73, 62, 229, 0.05) 100%); border: 2px dashed #493ee5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #493ee5; padding: 24px; }
        
        /* Pinch to zoom area */
        #zoom-area { transform-origin: 0 0; transition: transform 0.1s ease-out; }
        
        /* Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .countdown-pulse::after {
            content: ''; position: absolute; inset: -4px; border-radius: inherit;
            border: 2px solid #ba1a1a; animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;

<!-- Scripts for interaction -->
<script>
        // Simple Countdown Timer
        let timeInSecs = 10 * 60; // 10 minutes
        const timerElement = document.getElementById('timer');
        
        setInterval(() => {
            if(timeInSecs <= 0) return;
            timeInSecs--;
            const mins = Math.floor(timeInSecs / 60);
            const secs = timeInSecs % 60;
            timerElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            if(timeInSecs < 60) {
                timerElement.classList.replace('bg-error-container', 'bg-error');
                timerElement.classList.replace('text-on-error-container', 'text-on-error');
            }
        }, 1000);

        // Map Pan/Zoom Logic (Basic Implementation for demo)
        const container = document.getElementById('map-container');
        const zoomArea = document.getElementById('zoom-area');
        
        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let start = { x: 0, y: 0 };

        function setTransform() {
            zoomArea.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        container.onmousedown = function (e) {
            e.preventDefault();
            start = { x: e.clientX - pointX, y: e.clientY - pointY };
            panning = true;
        }
        container.onmouseup = function (e) { panning = false; }
        container.onmouseleave = function (e) { panning = false; }
        container.onmousemove = function (e) {
            e.preventDefault();
            if (!panning) return;
            pointX = (e.clientX - start.x);
            pointY = (e.clientY - start.y);
            setTransform();
        }
        
        // Touch events for mobile panning
        container.addEventListener('touchstart', function(e) {
            start = { x: e.touches[0].clientX - pointX, y: e.touches[0].clientY - pointY };
            panning = true;
        }, {passive: false});
        
        container.addEventListener('touchmove', function(e) {
            if (!panning) return;
            e.preventDefault();
            pointX = (e.touches[0].clientX - start.x);
            pointY = (e.touches[0].clientY - start.y);
            setTransform();
        }, {passive: false});
        
        container.addEventListener('touchend', function(e) { panning = false; });

        // Zoom controls
        window.zoomIn = () => { scale = Math.min(scale + 0.2, 3); setTransform(); }
        window.zoomOut = () => { scale = Math.max(scale - 0.2, 0.5); setTransform(); }
        window.resetZoom = () => { scale = 1; pointX = 0; pointY = 0; setTransform(); }
        
        // Initial center attempt
        window.onload = () => {
            const containerRect = container.getBoundingClientRect();
            pointX = (containerRect.width - 800) / 2;
            pointY = (containerRect.height - 800) / 2;
            setTransform();
        }
    </script>
