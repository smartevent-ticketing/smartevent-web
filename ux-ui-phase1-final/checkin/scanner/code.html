<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #000;
            color: white;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .camera-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Placeholder for camera feed */
            background-color: #1a1a1a;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through except where intended */
        }

        /* Dark overlay with cutout for scanning */
        .scan-area-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Using a mask to create the transparent scanning box */
            -webkit-mask-image: linear-gradient(black, black),
                                linear-gradient(black, black);
            -webkit-mask-size: 100% 100%, 280px 280px;
            -webkit-mask-position: center, center;
            -webkit-mask-repeat: no-repeat, no-repeat;
            -webkit-mask-composite: source-out;
            mask-composite: subtract;
            background: rgba(0, 0, 0, 0.7);
        }

        /* The glowing frame */
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            z-index: 3;
            pointer-events: none;
        }

        .scan-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
        }
        
        /* Corner markers */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #493ee5; /* Electric Indigo */
            border-style: solid;
        }
        .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 24px; }
        .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 24px; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 24px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 24px; }

        /* Scanning line animation */
        .scan-line {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 90%;
            height: 2px;
            background: #493ee5;
            box-shadow: 0 0 10px #493ee5, 0 0 20px #493ee5;
            animation: scan 2.5s infinite linear;
            border-radius: 50%;
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }

        /* Interactive elements */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: auto; /* Enable clicks here */
        }
        
        .glass-panel {
            background: rgba(39, 49, 67, 0.85); /* inverse-surface with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Focus rings for accessibility */
        .focus-ring-target:focus-visible {
            outline: 2px solid #493ee5;
            outline-offset: 2px;
            border-radius: 8px;
        }
    </style>
