<body class="bg-primary min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-body-md" style="background-color: rgb(22, 163, 106); min-height: 100dvh;">

<!-- Main Content Canvas -->
<main class="z-10 w-full max-w-md px-lg flex flex-col items-center">
<!-- Success Animation/Icon -->
<div class="mb-lg animate-bounce flex justify-center" style="animation-duration: 2s;">
<span class="material-symbols-outlined text-on-primary" style="font-size: 120px; font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
</div>
<h1 class="text-display-lg font-display-lg text-on-primary text-center mb-xl drop-shadow-md uppercase tracking-widest">SUCCESS</h1>
<!-- Ticket Info Card -->
<div class="bg-surface/10 backdrop-blur-md border border-on-primary/20 rounded-xl p-lg w-full mb-xl shadow-lg gap-md">
<div class="mb-md pb-md border-b border-on-primary/20">
<p class="text-label-sm font-label-sm text-primary-fixed uppercase tracking-widest mb-xs">Khách hàng</p>
<p class="text-headline-md font-headline-md text-on-primary">Nguyễn Văn A</p>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<p class="text-label-sm font-label-sm text-primary-fixed uppercase tracking-widest mb-xs">Loại vé</p>
<div class="inline-flex items-center bg-primary-fixed text-on-primary-fixed px-sm py-xs rounded-full">
<span class="material-symbols-outlined mr-xs" style="font-size: 16px;">star</span>
<span class="text-label-md font-label-md">VIP Pass</span>
</div>
</div>
<div>
<p class="text-label-sm font-label-sm text-primary-fixed uppercase tracking-widest mb-xs">Vị trí</p>
<p class="text-title-lg font-title-lg text-on-primary font-numeric-tabular">A1-12</p>
</div>
<div class="col-span-2 mt-sm">
<p class="text-label-sm font-label-sm text-primary-fixed uppercase tracking-widest mb-xs">Cổng</p>
<p class="text-title-lg font-title-lg text-on-primary">Gate A</p>
</div>
</div>
</div>
<!-- Actions -->
<button class="w-full bg-on-primary h-[48px] rounded-full text-title-lg font-title-lg flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors shadow-sm focus:ring-2 focus:ring-offset-2" onclick="resetScanner()" style="color: rgb(22, 163, 106);">
<span class="material-symbols-outlined">qr_code_scanner</span>
            Tiếp tục quét
        </button>
<p class="text-label-md font-label-md mt-md text-center opacity-90 text-on-primary">
            Tự động chuyển sau <span class="font-numeric-tabular font-bold" id="countdown">2</span> giây...
        </p>
</main>
<script>
        let timeLeft = 2;
        const countdownEl = document.getElementById('countdown');
        let timerId;

        function startCountdown() {
            timerId = setInterval(() => {
                timeLeft -= 1;
                if (countdownEl) countdownEl.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    resetScanner();
                }
            }, 1000);
        }

        function resetScanner() {
            clearInterval(timerId);
            // In a real application, this would transition back to the camera scanner view
            console.log("Navigating back to scanner...");
            
            // Visual feedback for the demo
            document.body.style.opacity = '0.5';
            setTimeout(() => {
                document.body.style.opacity = '1';
                timeLeft = 2;
                if(countdownEl) countdownEl.innerText = timeLeft;
                startCountdown();
            }, 500);
        }

        // Initialize countdown on load
        window.onload = startCountdown;
    </script>
