<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SMART EVENT - Hủy sự kiện</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#dfe8ff",
                        "inverse-on-surface": "#ecf0ff",
                        "surface-dim": "#d0daf2",
                        "on-primary-container": "#fefaff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#d9e3fb",
                        "tertiary-fixed-dim": "#ffb3ac",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "inverse-surface": "#273143",
                        "secondary-container": "#dee1fb",
                        "on-tertiary-fixed-variant": "#910913",
                        "error": "#ba1a1a",
                        "background": "#f9f9ff",
                        "on-tertiary-container": "#fffaf9",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-container": "#d13e3a",
                        "primary-container": "#635bff",
                        "on-primary-fixed-variant": "#321ed2",
                        "secondary-fixed-dim": "#c2c5de",
                        "primary-fixed-dim": "#c3c0ff",
                        "primary": "#493ee5",
                        "on-tertiary-fixed": "#410003",
                        "surface-variant": "#d9e3fb",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "surface-container-low": "#f0f3ff",
                        "primary-fixed": "#e2dfff",
                        "tertiary-fixed": "#ffdad6",
                        "inverse-primary": "#c3c0ff",
                        "secondary-fixed": "#dee1fb",
                        "on-background": "#111c2d",
                        "surface-container": "#e8eeff",
                        "on-secondary-fixed": "#171b2d",
                        "on-secondary-container": "#606379",
                        "surface-tint": "#4c42e9",
                        "error-container": "#ffdad6",
                        "secondary": "#5a5d73",
                        "surface": "#f9f9ff",
                        "on-surface-variant": "#464555",
                        "tertiary": "#ae2424",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-surface": "#111c2d",
                        "on-secondary-fixed-variant": "#42465a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xs": "4px",
                        "base": "8px",
                        "gutter": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "container-max": "1280px",
                        "xxl": "48px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "numeric-tabular": ["Be Vietnam Pro"],
                        "display-lg": ["Be Vietnam Pro"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "title-lg": ["Be Vietnam Pro"],
                        "headline-md": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "numeric-tabular": ["inherit", { "lineHeight": "inherit", "fontWeight": "inherit" }],
                        "display-lg": ["48px", { "lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f9f9ff; /* surface */
        }
        .modal-overlay {
            background-color: rgba(17, 28, 45, 0.5); /* on-background with opacity */
            backdrop-filter: blur(4px);
        }
        .focus-ring:focus-visible {
            outline: 2px solid #493ee5; /* primary */
            outline-offset: 2px;
        }
    </style>
</head>
<body class="antialiased text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center relative">
<!-- Mock Background for Context -->
<div class="absolute inset-0 z-0 bg-surface flex flex-col">
<!-- Mock TopNav -->
<header class="flex justify-between items-center px-gutter w-full h-16 sticky top-0 z-50 bg-surface border-b border-outline-variant flat no shadows">
<div class="flex items-center gap-md">
<span class="font-headline-md text-headline-md font-bold text-primary">SMART EVENT</span>
</div>
</header>
<main class="flex-1 p-gutter grid grid-cols-12 gap-gutter">
<!-- Mock Content Layout -->
<div class="col-span-12 md:col-span-8 bg-surface-container-lowest rounded-xl border border-outline-variant p-lg h-96">
<div class="h-8 bg-surface-container-high rounded w-1/3 mb-md"></div>
<div class="h-4 bg-surface-container rounded w-full mb-sm"></div>
<div class="h-4 bg-surface-container rounded w-5/6 mb-sm"></div>
<div class="h-4 bg-surface-container rounded w-2/3"></div>
</div>
<div class="col-span-12 md:col-span-4 bg-surface-container-lowest rounded-xl border border-outline-variant p-lg h-96 flex flex-col justify-end items-end">
<button class="bg-error text-on-error font-label-md text-label-md py-3 px-6 rounded-lg font-bold shadow-sm">Hủy sự kiện</button>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="absolute inset-0 z-50 flex items-center justify-center modal-overlay p-4">
<!-- Modal Container (Level 3 Elevation) -->
<div class="bg-surface-container-lowest rounded-xl w-full max-w-lg overflow-hidden flex flex-col" style="box-shadow: 0px 12px 32px rgba(16, 20, 38, 0.12);">
<!-- Modal Header -->
<div class="px-lg py-md border-b border-outline-variant flex items-center justify-between">
<h2 class="font-title-lg text-title-lg text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
                    Hủy sự kiện?
                </h2>
<button aria-label="Đóng" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container p-sm rounded-full transition-colors focus-ring">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Hành động này không thể hoàn tác. Trạng thái sự kiện sẽ chuyển thành <span class="font-label-md text-label-md text-error bg-error-container px-2 py-1 rounded-full">Đã hủy</span>.
                </p>
<!-- Notice Box -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-md flex gap-md items-start">
<span class="material-symbols-outlined text-primary mt-xs" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-surface">
<strong class="font-label-md text-label-md">Lưu ý:</strong> Bạn cần chủ động liên hệ hoàn tiền cho khách hàng nếu có.
                    </p>
</div>
</div>
<!-- Modal Footer / Actions -->
<div class="px-lg py-md bg-surface border-t border-outline-variant flex justify-end gap-md items-center">
<button class="font-label-md text-label-md text-on-surface hover:bg-surface-container-highest px-6 py-3 rounded-lg transition-colors border border-outline-variant focus-ring">
                    Quay lại
                </button>
<button class="font-label-md text-label-md text-on-error bg-error hover:opacity-90 px-6 py-3 rounded-lg transition-opacity font-bold shadow-sm focus-ring flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">delete</span>
                    Xác nhận hủy
                </button>
</div>
</div>
</div>
</body></html>
